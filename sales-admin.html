<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>屿礼·销售人员管理</title>
<style>
:root{--bg:#FAFAF7;--accent:#B8976A;--text:#1A1A1A;--text2:#5A564E;--text3:#9A9488;--border:#E8E3DC;--serif:"Noto Serif SC","Songti SC",serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--serif);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.header{background:linear-gradient(135deg,#1a1a1a 0%,#2d2520 100%);padding:20px 16px 16px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{color:#fff;font-size:18px;font-weight:600;letter-spacing:1px}
.header p{color:rgba(255,255,255,0.5);font-size:12px;margin-top:4px}
.gate{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px}
.gate.hidden{display:none}
.gate-box{width:100%;max-width:300px;text-align:center}
.gate-box h2{font-size:20px;margin-bottom:8px;color:var(--text)}
.gate-box p{font-size:13px;color:var(--text3);margin-bottom:20px}
.gate-box input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:var(--serif);text-align:center;margin-bottom:14px}
.gate-box input:focus{outline:none;border-color:var(--accent)}
.gate-box button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:var(--serif);cursor:pointer}
.gate-err{color:#c0392b;font-size:13px;margin-top:8px;display:none}
.tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:68px;z-index:90}
.tab{flex:1;padding:14px 0;text-align:center;font-size:14px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.content{padding:16px}
.panel{display:none}
.panel.active{display:block}
.add-form{background:#fff;border-radius:12px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
.add-form h3{font-size:15px;margin-bottom:14px;color:var(--text)}
.add-form .field{margin-bottom:12px}
.add-form label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px}
.add-form input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--serif)}
.add-form input:focus{outline:none;border-color:var(--accent)}
.add-form .btn-add{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:var(--serif);cursor:pointer;margin-top:4px}
.account-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border);position:relative}
.account-card .name{font-size:16px;font-weight:600;color:var(--text)}
.account-card .username{font-size:13px;color:var(--text3);margin-top:2px}
.account-card .info{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--text2)}
.account-card .info span{display:flex;align-items:center;gap:4px}
.account-card .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.account-card .actions button{padding:8px 14px;border-radius:8px;font-size:12px;font-family:var(--serif);cursor:pointer;border:none}
.btn-toggle{background:#f0ebe3;color:var(--text2)}
.btn-delete{background:#fde8e8;color:#c0392b}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-active{background:#e8f5e9;color:#27ae60}
.badge-disabled{background:#fde8e8;color:#c0392b}
.order-card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--border)}
.order-card .top{display:flex;justify-content:space-between;align-items:center}
.order-card .order-id{font-size:14px;font-weight:600;color:var(--accent)}
.order-card .time{font-size:11px;color:var(--text3)}
.order-card .items{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.6}
.order-card .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #f0ebe3}
.order-card .total{font-size:15px;font-weight:600;color:var(--text)}
.order-card .customer{font-size:12px;color:var(--text3)}
.status-tag{padding:2px 8px;border-radius:20px;font-size:11px}
.status-confirmed{background:#fff3e0;color:#e67e22}
.status-paid{background:#e8f5e9;color:#27ae60}
.status-shipped{background:#e3f2fd;color:#2980b9}
.status-delivered{background:#f0ebe3;color:var(--text2)}
.status-cancelled{background:#fde8e8;color:#c0392b}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.filter-btn{padding:7px 14px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap;font-family:var(--serif)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:#fff;border-radius:10px;padding:14px;text-align:center;border:1px solid var(--border)}
.stat-box .num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-box .label{font-size:11px;color:var(--text3);margin-top:4px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.loading{text-align:center;padding:20px;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div class="header"><h1>销售人员管理</h1><p>屿礼·九土</p></div>
<div class="gate" id="gate"><div class="gate-box"><h2>🔐 管理员登录</h2><p>请输入管理密码</p><input type="password" id="gatePass" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()"><button onclick="doLogin()">登录</button><div class="gate-err" id="gateErr">密码错误，请重试</div></div></div>
<div class="tabs" id="mainTabs" style="display:none"><div class="tab active" onclick="switchTab('people')">人员管理</div><div class="tab" onclick="switchTab('orders')">订单查询</div><div class="tab" onclick="switchTab('stats')">业绩统计</div></div>
<div class="content" id="mainContent" style="display:none">
<div class="panel active" id="panelPeople"><div class="add-form"><h3>➕ 添加销售人员</h3><div class="field"><label>姓名</label><input type="text" id="addName" placeholder="请输入姓名"></div><div class="field"><label>工号</label><input type="text" id="addUser" placeholder="请输入工号"></div><div class="field"><label>密码</label><input type="password" id="addPass" placeholder="请输入密码"></div><button class="btn-add" onclick="addAccount()">确认添加</button></div><div id="accountList"></div></div>
<div class="panel" id="panelOrders"><div class="filter-bar" id="filterBar"></div><div id="orderList"></div></div>
<div class="panel" id="panelStats"><div class="stats" id="statsGrid"></div><div id="rankList"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API_BASE = 'https://yuli-api.3235656835.workers.dev';
const ADMIN_PASSWORD = 'jiutu2026';
let salesAccounts = [];
let orders = [];
let currentFilter = 'all';
function fetchWithTimeout(url, opts, timeout) {
  timeout = timeout || 8000;
  return Promise.race([fetch(url, opts), new Promise(function(_, reject) { setTimeout(function() { reject(new Error('timeout')); }, timeout); })]);
}
function showToast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2000); }
function doLogin() { var pwd = document.getElementById('gatePass').value; if (pwd === ADMIN_PASSWORD) { document.getElementById('gate').classList.add('hidden'); document.getElementById('mainTabs').style.display = 'flex'; document.getElementById('mainContent').style.display = 'block'; loadData(); } else { document.getElementById('gateErr').style.display = 'block'; setTimeout(function() { document.getElementById('gateErr').style.display = 'none'; }, 2000); } }
function switchTab(name) { document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); }); document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); }); event.target.classList.add('active'); document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active'); if (name === 'orders') renderOrders(); if (name === 'stats') renderStats(); }
async function loadData() { document.getElementById('accountList').innerHTML = '<div class="loading">加载中...</div>'; try { var resp = await fetchWithTimeout(API_BASE + '/api/sales'); var result = await resp.json(); if (result.ok) { salesAccounts = result.data || []; renderAccounts(); } else { document.getElementById('accountList').innerHTML = '<div class="empty">加载失败：' + (result.error || '未知错误') + '</div>'; } } catch(e) { document.getElementById('accountList').innerHTML = '<div class="empty">网络错误，请检查网络连接</div>'; } }
function renderAccounts() { var list = document.getElementById('accountList'); if (salesAccounts.length === 0) { list.innerHTML = '<div class="empty">还没有销售人员<br>点击上方添加</div>'; return; } var html = ''; salesAccounts.forEach(function(a, idx) { html += '<div class="account-card"><div class="name">' + esc(a.name) + '</div><div class="username">工号：' + esc(a.username) + '</div><div class="info"><span>密码：' + esc(a.password) + '</span><span class="badge ' + (a.active !== false ? 'badge-active' : 'badge-disabled') + '">' + (a.active !== false ? '启用' : '停用') + '</span></div><div class="actions"><button class="btn-toggle" onclick="toggleAccount(' + idx + ')">' + (a.active !== false ? '停用' : '启用') + '</button><button class="btn-delete" onclick="deleteAccount(' + idx + ')">删除</button></div></div>'; }); list.innerHTML = html; }
async function addAccount() { var name = document.getElementById('addName').value.trim(); var user = document.getElementById('addUser').value.trim(); var pass = document.getElementById('addPass').value; if (!name) { showToast('请输入姓名'); return; } if (!user) { showToast('请输入工号'); return; } if (!pass) { showToast('请输入密码'); return; } try { var resp = await fetchWithTimeout(API_BASE + '/api/sales', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, username: user, password: pass, active: true }) }); var result = await resp.json(); if (result.ok) { showToast('添加成功：' + name); document.getElementById('addName').value = ''; document.getElementById('addUser').value = ''; document.getElementById('addPass').value = ''; await loadData(); } else { showToast('添加失败：' + (result.error || '未知错误')); } } catch(e) { showToast('网络错误：' + e.message); } }
async function toggleAccount(idx) { var a = salesAccounts[idx]; var newActive = a.active === false ? true : false; try { var resp = await fetchWithTimeout(API_BASE + '/api/sales/' + a.recordId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ active: newActive }) }); var result = await resp.json(); if (result.ok) { showToast(a.name + (newActive ? ' 已启用' : ' 已停用')); await loadData(); } else { showToast('操作失败'); } } catch(e) { showToast('网络错误'); } }
async function deleteAccount(idx) { var a = salesAccounts[idx]; if (!confirm('确定删除 ' + a.name + '？')) return; try { var resp = await fetchWithTimeout(API_BASE + '/api/sales/' + a.recordId, { method: 'DELETE' }); var result = await resp.json(); if (result.ok) { showToast('已删除：' + a.name); await loadData(); } else { showToast('删除失败'); } } catch(e) { showToast('网络错误'); } }
async function loadOrders() { try { var resp = await fetchWithTimeout(API_BASE + '/api/orders'); var result = await resp.json(); if (result.ok) { orders = result.data || []; } } catch(e) {} }
function renderOrders() { loadOrders().then(function() { var filterBar = document.getElementById('filterBar'); var html = '<div class="filter-btn ' + (currentFilter === 'all' ? 'active' : '') + '" onclick="filterOrders(\'all\')">全部</div>'; salesAccounts.forEach(function(a) { if (a.active !== false) { html += '<div class="filter-btn ' + (currentFilter === a.name ? 'active' : '') + '" onclick="filterOrders(\'' + esc(a.name) + '\')">' + esc(a.name) + '</div>'; } }); filterBar.innerHTML = html; var filtered = currentFilter === 'all' ? orders : orders.filter(function(o) { return o.salesperson === currentFilter; }); filtered = filtered.slice().reverse(); var list = document.getElementById('orderList'); if (filtered.length === 0) { list.innerHTML = '<div class="empty">暂无订单</div>'; return; } var out = ''; filtered.forEach(function(o) { var items = ''; if (Array.isArray(o.items)) { o.items.forEach(function(it) { items += (it.name || '') + ' ×' + (it.qty || 1) + ' '; }); } var statusMap = { confirmed: '待确认', paid: '已付款', shipped: '已发货', delivered: '已完成', cancelled: '已取消' }; out += '<div class="order-card"><div class="top"><span class="order-id">' + esc(o.orderNo || o.id) + '</span><span class="time">' + formatTime(o.time) + '</span></div><div class="items">' + (items || '商品明细') + '</div><div class="bottom"><span class="customer">' + esc(o.customer?.name || '') + ' ' + esc(o.customer?.phone || '') + '</span><span class="total">¥' + (o.total || 0).toFixed(2) + '</span><span class="status-tag status-' + (o.status || 'confirmed') + '">' + (statusMap[o.status] || o.status) + '</span></div></div>'; }); list.innerHTML = out; }); }
function filterOrders(name) { currentFilter = name; renderOrders(); }
function renderStats() { loadOrders().then(function() { var totalOrders = orders.length; var totalRevenue = orders.reduce(function(s, o) { return s + (o.total || 0); }, 0); var avgOrder = totalOrders > 0 ? totalRevenue / totalOrders : 0; var statsHtml = '<div class="stat-box"><div class="num">' + totalOrders + '</div><div class="label">总订单数</div></div><div class="stat-box"><div class="num">¥' + totalRevenue.toFixed(0) + '</div><div class="label">总销售额</div></div><div class="stat-box"><div class="num">¥' + avgOrder.toFixed(0) + '</div><div class="label">客单价</div></div>'; document.getElementById('statsGrid').innerHTML = statsHtml; var rank = {}; salesAccounts.forEach(function(a) { rank[a.name] = 0; }); orders.forEach(function(o) { if (o.salesperson && rank[o.salesperson] !== undefined) rank[o.salesperson] += (o.total || 0); }); var rankArr = Object.entries(rank).sort(function(a, b) { return b[1] - a[1]; }); var rankHtml = '<div class="add-form"><h3>📊 业绩排行</h3>'; rankArr.forEach(function(r, i) { var medals = ['', '🥈', '🥉']; rankHtml += '<div class="account-card" style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><span>' + (medals[i] || (i+1) + '.') + ' ' + esc(r[0]) + '</span><span style="font-weight:600;color:var(--accent)">¥' + r[1].toFixed(2) + '</span></div></div>'; }); rankHtml += '</div>'; document.getElementById('rankList').innerHTML = rankHtml; }); }
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatTime(t) { if (!t) return ''; var d = new Date(t); return (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }
</script>
</body>
</html>
